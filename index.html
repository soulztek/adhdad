<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f6f5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ADHDad" />
<meta name="description" content="ADHDad: chores, parenting reminders, connection habits, easy home workouts and ADHD mind check-ins." />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<title>ADHDad</title>
<style>
  :root{--bg:#f4f6f5;--elev:#ffffff;--card:#ffffff;--fill2:#eff2f0;--border:#e8ebe9;--border-strong:#d2d7d4;--focus:#e8734a;--primary:#e8734a;--accent:#e8734a;--on-accent:#ffffff;--ink:#111312;--on-ink:#ffffff;--blue:#e8734a;--accent-subtle:#fdeee7;--text:#111312;--text2:#5f6763;--text3:#9aa19d;--link:#b9532c;--zebra:transparent;--shadow:0 1px 2px rgba(17,19,18,0.03),0 6px 20px rgba(17,19,18,0.045);--glass:rgba(255,255,255,0.9);--nav:#111111;--warn-bg:#fbf5e6;--info-bg:#eff2f0;color-scheme:light}
  :root[data-theme=dark]{--bg:#0e100f;--elev:#181b1a;--card:#181b1a;--fill2:#232725;--border:#262a28;--border-strong:#3a3f3c;--focus:#ff9468;--primary:#ff9468;--accent:#ff9468;--on-accent:#0e100f;--ink:#f2f4f3;--on-ink:#111312;--blue:#ff9468;--accent-subtle:rgba(255,148,104,0.14);--text:#f2f4f3;--text2:#a3aba7;--text3:#6f7773;--link:#ffb08f;--zebra:transparent;--shadow:0 1px 2px rgba(0,0,0,0.3);--glass:rgba(24,27,26,0.85);--nav:#000000;--warn-bg:rgba(245,184,0,0.10);--info-bg:#232725;color-scheme:dark}
  main *,section *{min-width:0} html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  button,input,select{font:inherit;}
  button{transition:background-color .2s ease,color .2s ease,opacity .2s ease,transform .15s ease,box-shadow .2s ease}
  button:active:not(:disabled){transform:scale(0.985)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
  input::placeholder{color:var(--text3)}
  table{border-collapse:collapse;width:100%;}
  ::-webkit-scrollbar{height:4px;width:4px}
  .hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none}
  .hscroll::-webkit-scrollbar,.noscroll::-webkit-scrollbar{display:none}
  .noscroll{scrollbar-width:none}
  .hscroll>*{scroll-snap-align:start}
  .clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .noscrollbar{scrollbar-width:none}.noscrollbar::-webkit-scrollbar{display:none}
  .fadein{animation:fadein .28s ease both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script>try{var u=JSON.parse(localStorage.getItem("adhdad-ui")||"{}");if(u.dark)document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
